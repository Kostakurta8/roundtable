name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The e2e job below is opt-in and runs on this event only.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless before it arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The suite finishes in about fifteen seconds on a developer machine. What this bound is really
    # for is the hub: it is a file watcher, and a watcher that never sees the event it is waiting
    # for does not fail, it waits. Ten minutes is far more than the work needs and far less than a
    # hung watcher would otherwise cost.
    timeout-minutes: 10

    strategy:
      # The entire point of this matrix is to find out which platforms work — the app has only ever
      # been run on Windows. Cancelling the other five jobs the moment one fails would answer that
      # question for exactly one of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `engines.node` is >=22.12, so 22 is the floor and 24 is what the author runs.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Binds nothing. Every hub test starts its own in-process server on an ephemeral port and
      # points it at a per-test `ROUNDTABLE_HOME`, so nothing here touches a real `~/.claude` or a
      # fixed port.
      - name: Unit tests
        run: npm test

      # There is no `build` script — the client is a plain Vite app and this is the only step that
      # compiles it the way a user would receive it. A type error `tsc` tolerates but the bundler
      # does not (or vice versa) shows up here and nowhere else.
      - name: Build
        run: npx vite build

  e2e:
    name: e2e (linux, ${{ matrix.watch }} watcher)
    # This job was manual-only until it had ever passed on a runner. It has now: run 31331751587,
    # 2026-08-09, headless Chromium on ubuntu-latest, green on the first attempt. So it gates
    # pushes and pull requests like everything else. What is still true about it:
    #
    #   * It binds 5173 (Vite, `strictPort`) and 7411 (an in-process hub started inside the spec),
    #     which is why it cannot share a runner with anything else and why it is not in the matrix.
    #   * `playwright.config.ts` sets `reuseExistingServer: !process.env.CI`, so on a runner it
    #     starts its own Vite rather than adopting a stray one.
    #   * The spec forces `usePolling: true` on the watcher, so a green run here still says nothing
    #     about the `fs.watch` path that Linux and macOS use by default. That gap is the matrix's
    #     to close, not this job's.
    #   * Before this ran, the suite had only ever executed on Windows against a locally installed
    #     Chromium with a human watching. One green Linux run is one data point, not a warranty.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Two legs because the watcher is the one thing the rest of CI cannot reach. The unit suite
      # forces `usePolling: true` in every hub test, so `fs.watch` — what every non-Windows user
      # actually runs on — was exercised by nothing at all. The `native` leg is the only place in
      # this repo where the production default is under test.
      fail-fast: false
      matrix:
        watch: [polling, native]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # `--with-deps` pulls the system libraries a headless Chromium needs on a bare Ubuntu image.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e
        env:
          ROUNDTABLE_E2E_WATCH: ${{ matrix.watch }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per leg: `upload-artifact@v4` refuses a second upload under a name that already
          # exists, so a shared name would lose whichever leg finished second — the failing one, if
          # it ran longer.
          name: e2e-artifacts-${{ matrix.watch }}
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore
