name: Release asset

# The fast install line in the README is
#
#   npx https://github.com/Kostakurta8/roundtable/releases/latest/download/roundtable.tgz
#
# which only resolves if every release carries a packed build under exactly that name. `npx
# github:…` clones the repo, installs the dev dependencies and builds the client on the user's
# machine — measured at 38 to 99 seconds cold — while the packed tarball is the built package and
# installs in a few. So the tarball is made here, from the tagged commit, by the same `npm pack`
# the smoke test installs, and attached under a stable name as well as its versioned one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the tarball to
        required: true
      create:
        description: Create the release first, at the head of the branch this runs on, with the tag's CHANGELOG section as its notes
        type: boolean
        default: false
      title:
        description: The release's title, when creating it (default is the tag)
        required: false

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A release being created has no tag yet: it is made from the branch this was run on.
          ref: ${{ github.event.release.tag_name || (inputs.create && github.sha) || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # `npm pack` runs `prepack`, which builds `dist/`; the smoke test then installs that exact
      # tarball into an empty directory and runs it, so a broken pack never reaches the release.
      - run: npm run smoke
      # After the smoke test, so a build that cannot be installed never gets a release to sit on.
      # The notes are the tag's own section of CHANGELOG.md, which is written from `git log` and is
      # the release note every earlier release carried. `gh release create` makes the tag as well.
      # Only on a dispatch that asks for it: a published release already exists by definition.
      - name: Create the release
        if: github.event_name == 'workflow_dispatch' && inputs.create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; attaching to it"
          else
            v="${TAG#v}"
            awk -v head="## [$v]" 'index($0, head) == 1 { f = 1; next } /^## \[/ { if (f) exit } f' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $v"; exit 1; fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "${TITLE:-$TAG}" --notes-file notes.md
          fi
      - name: Pack and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # Replacing a file — a re-run, or a release that already carries one — failed three times
        # with "ReleaseAsset.name already exists" (422). The asset list embedded in the release
        # object (`releases/tags/<tag>`, which `gh release view` and `--clobber` read) lags behind
        # uploads, so it can report no asset where one exists and nothing gets deleted. The
        # release's own `/assets` listing is current, so the id comes from there; the upload is
        # still retried in case the delete itself takes a moment to land.
        run: |
          file=$(npm pack --silent | tail -n 1)
          cp "$file" roundtable.tgz
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          for name in "$file" roundtable.tgz; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id")
            if [ -n "$id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; fi
            for try in 1 2 3 4 5 6 7 8; do
              if gh release upload "$TAG" "$name"; then break; fi
              if [ "$try" = 8 ]; then exit 1; fi
              sleep 15
            done
          done
